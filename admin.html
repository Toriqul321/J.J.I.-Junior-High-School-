<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Admin</title><link rel="stylesheet" href="styles.css"><main class="container section"><h1>Admin Dashboard</h1><div id="login"><input id="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button class="btn btn-primary" onclick="go()">Login</button><p id="msg"></p></div><div id="panel" style="display:none"><button class="btn btn-primary" onclick="load()">Refresh</button> <button class="btn btn-primary" onclick="csv()">CSV Export</button><div style="overflow:auto;margin-top:20px"><table id="t" border="1" cellpadding="8"></table></div></div></main><script>let token='';async function go(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})}),x=await r.json();if(!r.ok)return msg.textContent=x.error;token=x.token;login.style.display='none';panel.style.display='block';load()}async function load(){let r=await fetch('/api/admin/registrations',{headers:{Authorization:'Bearer '+token}}),a=await r.json();t.innerHTML='<tr><th>ID</th><th>নাম</th><th>ব্যাচ</th><th>মোবাইল</th><th>ব্যাজ</th><th>ফি</th><th>পেমেন্ট</th><th>Status</th></tr>'+a.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.batch}</td><td>${x.phone}</td><td>${x.badge_name}</td><td>${x.amount}</td><td>${x.payment_method}</td><td>${x.payment_status}</td></tr>`).join('')}function csv(){fetch('/api/admin/export.csv',{headers:{Authorization:'Bearer '+token}}).then(r=>r.blob()).then(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='reunion-registrations.csv';a.click()})}</script></html>
