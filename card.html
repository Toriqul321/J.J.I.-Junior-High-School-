<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ID Card</title><link rel="stylesheet" href="styles.css"><style>.id{max-width:680px;margin:50px auto;border:4px solid #0b5d46;border-radius:20px;padding:30px;background:#fff}.id h1{text-align:center;color:#0b5d46}.idbody{display:grid;grid-template-columns:1fr 180px;gap:20px}.qr{width:170px}.r{padding:8px;border-bottom:1px dashed #ddd}@media print{button{display:none}.id{box-shadow:none}}</style><div class="id"><h1>যে যে আই জুনিয়র হাই স্কুল</h1><p style="text-align:center">পুনর্মিলনী · রাজঘাট, অভয়নগর, যশোর</p><div class="idbody"><div id="info">লোড হচ্ছে...</div><img id="qr" class="qr"></div><button class="btn btn-primary" onclick="print()">🖨️ Print / PDF</button></div><script>fetch('/api/registration/'+encodeURIComponent(new URLSearchParams(location.search).get('id'))).then(async r=>{let x=await r.json();if(!r.ok)throw Error(x.error);info.innerHTML='<div class=r><b>ID:</b> '+x.id+'</div><div class=r><b>নাম:</b> '+x.name+'</div><div class=r><b>ব্যাচ:</b> '+x.batch+'</div><div class=r><b>ব্যাজ:</b> '+x.badge_name+'</div><div class=r><b>ফি:</b> ৳'+x.amount+'</div><div class=r><b>Status:</b> '+x.payment_status+'</div>';qr.src=x.qr}).catch(e=>info.textContent=e.message)</script></html>
